{% load static %}

<!-- =========================================================
     TECHSCHE CAMPUS — SIDEBAR
========================================================= -->

<aside class="sidebar" id="sidebar">
  <!-- =====================================================
         BRAND / LOGO
    ====================================================== -->

  <div class="sidebar-brand">
    <a
      href="{% url 'dashboard' %}"
      class="brand"
      aria-label="Techsche Campus Dashboard"
    >
      <img
        src="{% static 'images/logo.png' %}"
        alt="Techsche Campus"
        class="sidebar-logo"
      />
    </a>

    <!-- Mobile close button -->

    <button
      type="button"
      class="sidebar-close"
      id="sidebarClose"
      aria-label="Close navigation"
    >
      ×
    </button>
  </div>

  <!-- =====================================================
         NAVIGATION
    ====================================================== -->

  <nav class="sidebar-nav" aria-label="Main navigation">
    <!-- =================================================
             MAIN
        ================================================== -->

    <div class="nav-section-title">MAIN</div>

    <!-- Dashboard -->

    <a
      href="{% url 'dashboard' %}"
      class="nav-item {% if request.resolver_match.url_name == 'dashboard' %} active {% endif %}"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"
          />
        </svg>
      </span>

      <span class="nav-label"> Dashboard </span>
    </a>

    <!-- Applications -->

    <a
      href="{% url 'applications' %}"
      class="nav-item {% if request.resolver_match.url_name == 'applications' %} active {% endif %}"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 1.5V8h4.5L14 3.5ZM8 12h8v1.5H8V12Zm0 4h8v1.5H8V16Zm0-8h4v1.5H8V8Z"
          />
        </svg>
      </span>

      <span class="nav-label"> Applications </span>

      {% if pending_applications %}

      <span class="nav-count"> {{ pending_applications }} </span>

      {% endif %}
    </a>

    <!-- Students -->

    <a
      href="{% url 'students' %}"
      class="nav-item {% if request.resolver_match.url_name == 'students' %} active {% endif %}"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0H5Zm14-8.5a3.5 3.5 0 1 0-1.2-6.8 5.7 5.7 0 0 1 0 6.1c.4.2.8.4 1.2.7ZM20 20h2a5.5 5.5 0 0 0-3.5-5.1c1 .9 1.5 2.3 1.5 3.8V20Z"
          />
        </svg>
      </span>

      <span class="nav-label"> Students </span>
    </a>

    <!-- Documents -->

    <a
      href="{% url 'documents' %}"
      class="nav-item {% if request.resolver_match.url_name == 'documents' %} active {% endif %}"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 1.5V8h4.5L14 3.5ZM8 12h8v1.5H8V12Zm0 4h6v1.5H8V16Z"
          />
        </svg>
      </span>

      <span class="nav-label"> Documents </span>
    </a>

    <!-- =================================================
             MANAGEMENT
        ================================================== -->

    <div class="nav-section-title">MANAGEMENT</div>

   
    <!-- Administrators -->

    <a
      href="{% url 'users' %}"
      class="nav-item {% if request.resolver_match.url_name == 'users' %} active {% endif %}"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0H5Zm14-8a3 3 0 1 0-1.2-5.8A5.8 5.8 0 0 1 18 12Zm-1 2.5c1.8 1.1 3 3.1 3 5.5h2a5.5 5.5 0 0 0-5-5.5Z"
          />
        </svg>
      </span>

      <span class="nav-label"> Administrators </span>
    </a>

    <!-- Settings -->

    <a
      href="{% url 'settings' %}"
      class="nav-item {% if request.resolver_match.url_name == 'settings' %} active {% endif %}"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="m19.4 13.5 1.6 1.2-2 3.4-1.9-.8a7.4 7.4 0 0 1-1.8 1l-.3 2h-4l-.3-2a7.4 7.4 0 0 1-1.8-1l-1.9.8-2-3.4 1.6-1.2a7.1 7.1 0 0 1 0-2L5 10.3l2-3.4 1.9.8a7.4 7.4 0 0 1 1.8-1l.3-2h4l.3 2a7.4 7.4 0 0 1 1.8 1l1.9-.8 2 3.4-1.6 1.2a7.1 7.1 0 0 1 0 2ZM13 15a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"
          />
        </svg>
      </span>

      <span class="nav-label"> Settings </span>
    </a>
  </nav>

  <!-- =====================================================
         SIDEBAR BOTTOM
    ====================================================== -->

  <div class="sidebar-footer">
    <!-- HELP -->

    <div class="help-card">
      <div class="help-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 17a1.2 1.2 0 1 1 0-2.4A1.2 1.2 0 0 1 12 19Zm1.4-5.4c-.7.5-.9.8-.9 1.4h-1.7c0-1.2.4-1.9 1.4-2.7.9-.7 1.4-1.1 1.4-2.1 0-1-.7-1.7-1.7-1.7-1.1 0-1.8.7-1.8 1.9H8.4c0-2.2 1.4-3.5 3.5-3.5 2.2 0 3.5 1.3 3.5 3.3 0 1.7-.9 2.6-2 3.4Z"
          />
        </svg>
      </div>

      <div class="help-content">
        <strong> Need help? </strong>

        <span> Contact support </span>
      </div>
    </div>

    <!-- LOGOUT -->

    <form method="post" action="{% url 'logout' %}" class="logout-form">
      {% csrf_token %}

      <button type="submit" class="logout-btn">
        <span class="logout-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-8v-2h8V6h-8V4Zm1 4 5 4-5 4v-3H3v-2h8V8Z"
            />
          </svg>
        </span>

        <span> Logout </span>
      </button>
    </form>
  </div>
</aside>

<!-- =========================================================
     MOBILE SIDEBAR OVERLAY
========================================================= -->

<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
